{% extends "base.html" %}

{% block title %}Ingreso — Nerdearla Live{% endblock %}

{% block main %}
  <div class="auth-shell">
    <div class="auth-card">
      <div style="display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 1.25rem;">
        <img src="https://nerdearla.com/static/images/NERDEARLA_black_nav.webp" alt="Nerdearla" class="brand-logo" style="height: 36px;" onerror="this.onerror=null; this.src='/static/images/nerdearla_logo.webp';" />
        <span class="brand-badge-live">LIVE</span>
      </div>
      <h1 class="auth-title" data-i18n="auth.title">Sign in</h1>
      <p class="auth-hint" data-i18n="auth.hint">Ingresa la contraseña para acceder al panel de control.</p>

      {% if invalid_pwd %}
        <div class="alert" role="alert" data-i18n="auth.invalid">Incorrect password. Please try again.</div>
      {% endif %}

      <form method="post" action="/login">
        <input type="hidden" name="next" value="{{ next_path }}" />
        <div class="auth-row">
          <label for="password" data-i18n="auth.label">Contraseña</label>
          <input
            id="password"
            type="password"
            name="password"
            placeholder="Ingresa la contraseña..."
            data-i18n-placeholder="auth.placeholder"
            autocomplete="current-password"
            required
          />
          <button class="btn btn-primary" type="submit" data-i18n="auth.submit">Ingresar</button>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
