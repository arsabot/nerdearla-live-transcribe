<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>{{ session.name }} — OBS Browser Source</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: transparent;
      --text-main: #fbb212;
      --text-sub: #fef08a;
      --text-orig: #9ca3af;
      --accent: #fbb212;
      --font-size: 3.6rem;
      --line-height: 1.35;
      --text-align: center;
      --justify-content: flex-end;
      --shadow-sub: 0 4px 18px rgba(0, 0, 0, 0.95), 0 2px 6px rgba(0,0,0,0.8), -2px -2px 4px rgba(0,0,0,0.8), 2px 2px 4px rgba(0,0,0,0.8);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: transparent !important;
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* Subtitles Container */
    .tv-screen-container {
      flex: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: var(--justify-content);
      align-items: center;
      padding: 0 4vw 4.5rem;
      position: relative;
    }

    .subtitles-stage-box {
      width: 100%;
      max-width: 1600px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      text-align: var(--text-align);
      /* background: rgba(0, 0, 0, 0.45); */
      padding: 2rem 3rem;
      border-radius: 20px;
      /* Removed backdrop-filter: blur(4px); as it causes severe rendering glitches in OBS CEF */
    }

    .active-caption {
      font-size: var(--font-size);
      line-height: var(--line-height);
      font-weight: 800;
      color: var(--text-main);
      text-shadow: var(--shadow-sub);
      word-break: break-word;
      
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    
    .active-caption.interim-live {
      opacity: 0.92;
    }
    
    .active-caption-sublang {
      font-size: calc(var(--font-size) * 0.72);
      line-height: var(--line-height);
      font-weight: 700;
      color: var(--text-sub);
      text-shadow: var(--shadow-sub);
      margin-top: 0.5rem;
      opacity: 0.95;
    }

    .prev-caption {
      font-size: calc(var(--font-size) * 0.52);
      line-height: 1.35;
      font-weight: 600;
      color: var(--text-orig);
      opacity: 0.65;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <main class="tv-screen-container">
    <div class="subtitles-stage-box">
      <div class="prev-caption" id="prevCaption">
        Esperando transmisión...
      </div>
      <div class="active-caption" id="activeCaption">
        Subtítulos para OBS
      </div>
      <div class="active-caption-sublang" id="activeSubCaption" style="display: none;"></div>
    </div>
  </main>

  <script>
    const SESSION_ID = {{ session.id | tojson }};
    let targetLanguages = {{ session.target_languages | tojson }};
    let sourceLanguage = {{ session.source_language | tojson }};

    // Permitir forzar los lenguajes desde la URL para OBS
    const urlParams = new URLSearchParams(window.location.search);
    const langParam = urlParams.get('lang') || urlParams.get('langs');
    if (langParam) {
      targetLanguages = langParam.split(',').map(l => l.trim().toLowerCase());
    }

    const activeCaption = document.getElementById('activeCaption');
    const activeSubCaption = document.getElementById('activeSubCaption');
    const prevCaption = document.getElementById('prevCaption');
    
    let lastCommittedText = '';
    let clearSubtitleTimeout = null;

    const NERDEARLA_REGEX = /\b(?:nerd(?:[-_.\s]*(?:e?ar\s*la|earl[ay]?|ear|er\s*la|eala|e\s*a\s*la|e\s*arla|a\s*la|dar\s*la|diar\s*la|dia\s*la|iar\s*la|ia\s*la|ierla|eada|eado|arlo|alas|alos|ela|ala|alla|alta|era|la)|[\.]la)|nerd\s+(?:de\s+)?(?:habla|aula|charla|arla|alma|armas)|nerd\s+y\s+(?:habla|arla)|nerdy\s*(?:arla|earla)|merd(?:[-_.\s]*(?:e?ar\s*la|er\s*la|eada|ear))|verd(?:[-_.\s]*(?:ear\s*la|e\s+habla)))\b/gi;
    function normalizeNerdearla(text) {
      if (!text) return text;
      return String(text).replace(NERDEARLA_REGEX, 'Nerdearla');
    }

    function getCaptionText(eventData) {
      const primaryLang = (targetLanguages && targetLanguages.length > 0) ? targetLanguages[0] : 'es';
      const srcLang = eventData.source_language || sourceLanguage || 'es';
      let text = '';
      if (eventData.translations && eventData.translations[primaryLang]) {
        text = eventData.translations[primaryLang];
      } else if (primaryLang === srcLang) {
        text = eventData.original || '';
      }
      return normalizeNerdearla(text);
    }

    function connectWebSocket() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}/ws/session/${SESSION_ID}/viewer`;
      const ws = new WebSocket(wsUrl);

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === 'handshake' && data.session) {
            // Only update targetLanguages from server if it wasn't forced via URL
            if (data.session.target_languages && !langParam) {
              targetLanguages = data.session.target_languages;
            }
            if (data.session.source_language) sourceLanguage = data.session.source_language;

            if (data.history && Array.isArray(data.history) && data.history.length > 0) {
              const last = data.history[data.history.length - 1];
              const prev = data.history.length > 1 ? data.history[data.history.length - 2] : null;
              if (prev) {
                prevCaption.textContent = getCaptionText(prev);
              }
              if (last) {
                lastCommittedText = getCaptionText(last);
                activeCaption.className = 'active-caption';
                activeCaption.textContent = lastCommittedText;
              }
            }
          } else if (data.type === 'clear_history') {
            lastCommittedText = '';
            prevCaption.textContent = '';
            activeCaption.textContent = '';
            activeSubCaption.style.display = 'none';
          } else if (data.type === 'interim' || data.type === 'final') {
            handleLiveSubtitle(data);
          }
        } catch (err) {}
      };

      ws.onclose = () => { setTimeout(connectWebSocket, 3000); };
      ws.onerror = () => { ws.close(); };
    }

    function handleLiveSubtitle(data) {
      const primaryLang = (targetLanguages && targetLanguages.length > 0) ? targetLanguages[0] : 'es';
      const secondaryLang = (targetLanguages && targetLanguages.length > 1) ? targetLanguages[1] : null;

      let mainText = getCaptionText(data);
      if (!mainText || !mainText.trim()) return;

      // Reset the clear timeout every time we get valid text
      if (clearSubtitleTimeout) clearTimeout(clearSubtitleTimeout);
      clearSubtitleTimeout = setTimeout(() => {
        activeCaption.textContent = '';
        prevCaption.textContent = '';
        activeSubCaption.style.display = 'none';
        lastCommittedText = '';
      }, 6000); // Wait 6 seconds of silence before hiding subtitles

      if (data.type === 'interim') {
        // Ignorar textos temporales para evitar confusión visual en la transmisión
        return;
      } else if (data.type === 'final') {
        if (lastCommittedText) {
          prevCaption.textContent = lastCommittedText;
        }
        lastCommittedText = mainText;

        activeCaption.className = 'active-caption';
        activeCaption.textContent = mainText;

        if (secondaryLang && data.translations && data.translations[secondaryLang]) {
          activeSubCaption.style.display = 'block';
          activeSubCaption.textContent = `${secondaryLang.toUpperCase()}: ${data.translations[secondaryLang]}`;
        } else {
          activeSubCaption.style.display = 'none';
        }
      }
    }

    connectWebSocket();
  </script>
</body>
</html>
