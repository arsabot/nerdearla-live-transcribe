<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f7fb" id="themeColorMeta" />
    <title>{% block title %}Live Translator{% endblock %}</title>

    <script>
      (function () {
        const KEY = 'srlt_theme';
        const meta = document.getElementById('themeColorMeta');
        let pref = null;
        try {
          pref = localStorage.getItem(KEY);
        } catch (_e) {
          pref = null;
        }

        const value = pref === 'light' || pref === 'dark' ? pref : 'system';
        const root = document.documentElement;

        if (value === 'system') {
          root.removeAttribute('data-theme');
        } else {
          root.setAttribute('data-theme', value);
        }

        if (meta) {
          const bg = value === 'dark' ? '#000000' : '#f6f7fb';
          meta.setAttribute('content', bg);
        }
      })();
    </script>

    <style>
      :root {
        color-scheme: light dark;

        --bg: #f8fafc;
        --panel: #ffffff;
        --panel-2: #f1f5f9;
        --panel-3: #e2e8f0;
        --text: #0f172a;
        --muted: #475569;
        --border: #cbd5e1;
        --border-focus: #219f9d;
        --shadow-sm: 0 1px 2px 0 rgba(15, 23, 42, 0.05);
        --shadow: 0 1px 3px 0 rgba(15, 23, 42, 0.1), 0 1px 2px -1px rgba(15, 23, 42, 0.08);
        --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.1), 0 2px 4px -2px rgba(15, 23, 42, 0.08);

        --primary: #fbb212;
        --primary-hover: #e5a00a;
        --primary-press: #cc8e08;
        --primary-text: #000000;
        
        --secondary: #219f9d;
        --secondary-hover: #1a8381;
        --secondary-press: #146b69;

        --danger: #e63e4a;
        --danger-hover: #cf2e3a;
        --danger-press: #b82430;

        --focus: #219f9d;

        --radius: 14px;
        --radius-sm: 10px;
        --radius-xs: 6px;
        --space-1: 8px;
        --space-2: 12px;
        --space-3: 16px;
        --space-4: 24px;
        --space-5: 32px;

        --container: 1400px;
        --log-font-size: 14px;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #000000;
          --panel: #0d0d0d;
          --panel-2: #161616;
          --panel-3: #222222;
          --text: #f8fafc;
          --muted: #94a3b8;
          --border: rgba(255, 255, 255, 0.16);
          --border-focus: #fbb212;
          --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.6);
          --shadow: 0 2px 8px rgba(0, 0, 0, 0.8), 0 12px 28px rgba(0, 0, 0, 0.6);
          --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.85);
        }
      }

      html[data-theme="light"] {
        color-scheme: light;
      }

      html[data-theme="light"]:root {
        --bg: #f8fafc;
        --panel: #ffffff;
        --panel-2: #f1f5f9;
        --panel-3: #e2e8f0;
        --text: #0f172a;
        --muted: #475569;
        --border: #cbd5e1;
        --border-focus: #219f9d;
        --shadow-sm: 0 1px 2px 0 rgba(15, 23, 42, 0.05);
        --shadow: 0 1px 3px 0 rgba(15, 23, 42, 0.1), 0 1px 2px -1px rgba(15, 23, 42, 0.08);
        --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.1), 0 2px 4px -2px rgba(15, 23, 42, 0.08);
      }

      html[data-theme="dark"] {
        color-scheme: dark;
      }

      html[data-theme="dark"]:root {
        --bg: #000000;
        --panel: #0d0d0d;
        --panel-2: #161616;
        --panel-3: #222222;
        --text: #f8fafc;
        --muted: #94a3b8;
        --border: rgba(255, 255, 255, 0.16);
        --border-focus: #fbb212;
        --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.6);
        --shadow: 0 2px 8px rgba(0, 0, 0, 0.8), 0 12px 28px rgba(0, 0, 0, 0.6);
        --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.85);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji",
          "Segoe UI Emoji";
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .skip-link {
        position: absolute;
        left: var(--space-3);
        top: var(--space-3);
        padding: 10px 12px;
        border-radius: 999px;
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        transform: translateY(-200%);
        transition: transform 160ms ease;
        z-index: 100;
      }

      .skip-link:focus {
        transform: translateY(0);
      }

      :focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }

      .page {
        min-height: 100dvh;
        padding: calc(var(--space-3) + env(safe-area-inset-top)) calc(var(--space-3) + env(safe-area-inset-right))
          calc(var(--space-4) + env(safe-area-inset-bottom)) calc(var(--space-3) + env(safe-area-inset-left));
        display: flex;
        flex-direction: column;
        gap: var(--space-3);
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
      }

      .topbar-inner {
        max-width: var(--container);
        margin: 0 auto;
        padding: var(--space-2);
        border-radius: var(--radius);
        border: 1px solid var(--border);
        background: color-mix(in srgb, var(--panel) 92%, transparent);
        box-shadow: var(--shadow);
        backdrop-filter: blur(10px);
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-2);
      }

      @supports not (background: color-mix(in srgb, white 92%, transparent)) {
        .topbar-inner {
          background: var(--panel);
        }
      }

      .brand {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 10px;
        min-width: 180px;
        text-decoration: none;
      }

      .brand-logo {
        height: 28px;
        width: auto;
        max-width: 160px;
        object-fit: contain;
        display: block;
        transition: transform 0.2s ease;
      }

      .brand:hover .brand-logo {
        transform: scale(1.03);
      }

      .brand-badge-live {
        background: #e63e4a;
        color: #ffffff;
        font-size: 0.68rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        padding: 2px 7px;
        border-radius: 4px;
        text-transform: uppercase;
        display: inline-flex;
        align-items: center;
        box-shadow: 0 0 8px rgba(230, 62, 74, 0.4);
      }

      .brand-title {
        margin: 0;
        font-size: 16px;
        letter-spacing: 0.2px;
        font-weight: 700;
        text-wrap: balance;
      }

      .brand-subtitle {
        margin: 0;
        font-size: 13px;
        color: var(--muted);
        text-wrap: balance;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: flex-end;
        gap: var(--space-2);
      }

      .control {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      label {
        font-size: 13px;
        color: var(--muted);
        font-weight: 700;
      }

      select,
      input[type="password"],
      input[type="text"],
      input[type="number"] {
        font: inherit;
        padding: 9px 14px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        box-shadow: var(--shadow-sm);
        font-weight: 500;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }

      select:focus,
      input:focus,
      textarea:focus {
        border-color: var(--border-focus);
        outline: none;
        box-shadow: 0 0 0 3px rgba(33, 159, 157, 0.2);
      }

      textarea {
        font: inherit;
        padding: 10px 14px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        box-shadow: var(--shadow-sm);
        resize: vertical;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }

      button {
        font: inherit;
      }

      .btn {
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        cursor: pointer;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        padding: 8px 16px;
        font-size: 0.88rem;
        font-weight: 700;
        letter-spacing: 0.01em;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        box-shadow: var(--shadow-sm);
        transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        text-decoration: none;
        user-select: none;
      }

      .btn:hover {
        background: var(--panel-2);
        border-color: var(--text);
        color: var(--text);
        transform: translateY(-1px);
        box-shadow: var(--shadow);
      }

      .btn:active {
        transform: translateY(1px);
        box-shadow: var(--shadow-sm);
      }

      .btn:disabled {
        cursor: not-allowed;
        opacity: 0.55;
        transform: none !important;
        box-shadow: none !important;
      }

      .icon-btn {
        width: 38px;
        height: 38px;
        padding: 0;
        border-radius: var(--radius-sm);
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .icon {
        width: 18px;
        height: 18px;
        display: block;
      }

      .theme-icon-sun,
      .theme-icon-moon {
        width: 18px;
        height: 18px;
      }

      html[data-theme="dark"] .theme-icon-moon,
      html:not([data-theme="dark"]) .theme-icon-sun {
        display: none !important;
      }

      html[data-theme="dark"] .theme-icon-sun,
      html:not([data-theme="dark"]) .theme-icon-moon {
        display: block !important;
      }

      .btn-primary {
        border-color: #d97706;
        background: var(--primary);
        color: #000000;
        font-weight: 800;
        box-shadow: 0 2px 6px rgba(251, 178, 18, 0.3);
      }

      .btn-primary:hover {
        background: var(--primary-hover);
        border-color: #b45309;
        color: #000000;
        transform: translateY(-1px);
        box-shadow: 0 4px 14px rgba(251, 178, 18, 0.45);
      }

      .btn-primary:active {
        background: var(--primary-press);
        color: #000000;
        transform: translateY(1px);
      }

      .btn-secondary {
        border-color: #0f766e;
        background: var(--secondary);
        color: #ffffff;
        font-weight: 700;
        box-shadow: 0 2px 6px rgba(33, 159, 157, 0.3);
      }

      .btn-secondary:hover {
        background: var(--secondary-hover);
        border-color: #115e59;
        color: #ffffff;
        transform: translateY(-1px);
        box-shadow: 0 4px 14px rgba(33, 159, 157, 0.45);
      }

      .btn-secondary:active {
        background: var(--secondary-press);
        color: #ffffff;
        transform: translateY(1px);
      }

      .btn-danger {
        border-color: #b91c1c;
        background: var(--danger);
        color: #ffffff;
        font-weight: 700;
        box-shadow: 0 2px 6px rgba(230, 62, 74, 0.3);
      }

      .btn-danger:hover {
        background: var(--danger-hover);
        border-color: #991b1b;
        color: #ffffff;
        transform: translateY(-1px);
        box-shadow: 0 4px 14px rgba(230, 62, 74, 0.45);
      }

      .btn-danger:active {
        background: var(--danger-press);
        color: #ffffff;
        transform: translateY(1px);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--panel);
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 0.2px;
        white-space: nowrap;
      }

      .badge::before {
        content: "";
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: currentColor;
        opacity: 0.5;
      }

      .badge--neutral {
        color: var(--muted);
      }

      .badge--success {
        color: #16a34a;
      }

      .badge--danger {
        color: #dc2626;
      }

      .badge--warn {
        color: #d97706;
      }

      .message {
        max-width: var(--container);
        margin: 0 auto;
        padding: 12px 14px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        border: 1px solid color-mix(in srgb, var(--danger) 30%, var(--border));
        background: var(--panel);
        background: color-mix(in srgb, var(--danger) 10%, var(--panel));
        color: var(--text);
        box-shadow: var(--shadow);
      }

      .main {
        max-width: var(--container);
        margin: 0 auto;
        width: 100%;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: var(--space-3);
        align-content: start;
      }

      .main-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.75fr) minmax(0, 1.75fr);
        gap: var(--space-3);
      }

      @media (max-width: 980px) {
        .main-grid {
          grid-template-columns: 1fr;
        }
        .brand {
          min-width: auto;
        }
      }

      .card {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--panel);
        box-shadow: var(--shadow);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        min-height: 240px;
      }

      .card-header {
        padding: var(--space-2) var(--space-3);
        border-bottom: 1px solid var(--border);
        background: var(--panel-2);
        background: color-mix(in srgb, var(--panel) 86%, var(--panel-2));
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: var(--space-2);
      }

      .card-title {
        margin: 0;
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.2px;
        text-wrap: balance;
      }

      .card-body {
        padding: var(--space-2);
        flex: 1;
        display: flex;
        min-height: 0;
      }

      .log {
        width: 100%;
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: var(--space-2);
        font-size: var(--log-font-size);
        overflow: auto;
        overscroll-behavior: contain;
        scrollbar-gutter: stable;
        scroll-behavior: smooth;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
        line-height: 1.45;
        overflow-wrap: anywhere;
      }

      .segment {
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid var(--border);
        border: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
        background: var(--panel);
        background: color-mix(in srgb, var(--panel) 75%, var(--panel-2));
        content-visibility: auto;
        contain-intrinsic-size: 44px;
        animation: segmentAppear 0.22s ease-out;
      }

      .segment-even {
        background: var(--panel-2);
        background: color-mix(in srgb, var(--panel) 68%, var(--panel-2));
      }

      .segment-odd {
        background: var(--panel);
        background: color-mix(in srgb, var(--panel) 82%, var(--panel-2));
      }

      .timestamp {
        font-variant-numeric: tabular-nums;
        font-size: 12px;
        color: var(--muted);
        margin-right: 8px;
        font-weight: 600;
      }

      .interim {
        color: var(--text);
        background: color-mix(in srgb, var(--primary) 12%, var(--panel));
        border: 1.5px dashed var(--primary);
        border-radius: 12px;
        padding: 10px 12px;
        font-style: normal;
        position: relative;
        display: flex;
        align-items: center;
        gap: 10px;
        box-shadow: 0 0 12px color-mix(in srgb, var(--primary) 22%, transparent);
        animation: interimPulse 2s ease-in-out infinite alternate;
      }

      .interim-badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.6px;
        padding: 2px 7px;
        border-radius: 6px;
        background: var(--primary);
        color: #ffffff;
        flex-shrink: 0;
        user-select: none;
      }

      .interim-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #ffffff;
        animation: liveBlink 0.9s ease infinite alternate;
      }

      .interim-text {
        flex: 1;
        font-weight: 500;
      }

      @keyframes interimPulse {
        0% {
          box-shadow: 0 0 6px color-mix(in srgb, var(--primary) 15%, transparent);
          border-color: var(--primary);
        }
        100% {
          box-shadow: 0 0 18px color-mix(in srgb, var(--primary) 35%, transparent);
          border-color: color-mix(in srgb, var(--primary) 70%, #ffffff);
        }
      }

      @keyframes liveBlink {
        from { opacity: 0.3; }
        to { opacity: 1; }
      }

      @keyframes segmentAppear {
        from {
          opacity: 0;
          transform: translateY(-5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .auth-shell {
        max-width: 520px;
        margin: 0 auto;
        width: 100%;
        padding-top: var(--space-5);
        display: flex;
        flex-direction: column;
        gap: var(--space-3);
      }

      .auth-card {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--panel);
        box-shadow: var(--shadow);
        padding: var(--space-4);
        display: flex;
        flex-direction: column;
        gap: var(--space-3);
      }

      .auth-title {
        margin: 0;
        font-size: 20px;
        font-weight: 800;
        text-wrap: balance;
      }

      .auth-hint {
        margin: 0;
        color: var(--muted);
      }

      .auth-row {
        display: flex;
        gap: var(--space-2);
        align-items: center;
        flex-wrap: wrap;
      }

      .auth-row input[type="password"] {
        flex: 1;
        min-width: 240px;
      }

      .alert {
        padding: 12px 14px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        border: 1px solid color-mix(in srgb, var(--danger) 30%, var(--border));
        background: var(--panel);
        background: color-mix(in srgb, var(--danger) 10%, var(--panel));
      }

            /* --- Modal Dialogs --- */
      .modal[hidden] {
        display: none !important;
      }

      .modal {
        position: fixed;
        inset: 0;
        z-index: 999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--space-3);
        overflow: hidden;
      }

      .modal-overlay {
        position: absolute;
        inset: 0;
        background: rgba(2, 6, 23, 0.65);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        z-index: 1;
      }

      .modal-card {
        position: relative;
        z-index: 2;
        width: min(760px, 100%);
        max-height: min(88dvh, 800px);
        height: auto;
        display: flex;
        flex-direction: column;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--panel);
        box-shadow: var(--shadow), 0 20px 40px rgba(0, 0, 0, 0.35);
        overflow: hidden;
      }

      .modal-card form {
        display: flex;
        flex-direction: column;
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
        margin: 0;
      }

      .modal-header {
        flex-shrink: 0;
        padding: var(--space-3) var(--space-4);
        border-bottom: 1px solid var(--border);
        background: var(--panel-2);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-2);
      }

      .modal-title {
        margin: 0;
        font-size: 16px;
        font-weight: 800;
        letter-spacing: 0.2px;
      }

      .modal-body {
        flex: 1 1 auto;
        min-height: 0;
        max-height: 100%;
        overflow-y: auto !important;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
        scrollbar-gutter: stable;
        padding: var(--space-4);
        display: flex;
        flex-direction: column;
        gap: var(--space-3);
      }

      .form-grid {
        display: grid;
        gap: 12px;
        grid-template-columns: 1fr 1fr;
        width: 100%;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
      }

      .field select,
      .field input[type="text"],
      .field input[type="number"],
      .field input[type="password"],
      .field textarea {
        width: 100%;
        box-sizing: border-box;
      }

      .settings-section-title {
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--primary);
        padding-top: 6px;
        padding-bottom: 4px;
        border-bottom: 1px solid var(--border);
        margin-top: 4px;
      }

      .hint {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
      }

      .checkbox {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        min-height: 36px;
        user-select: none;
      }

      .modal-actions {
        flex-shrink: 0;
        padding: var(--space-3) var(--space-4);
        border-top: 1px solid var(--border);
        background: var(--panel-2);
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: var(--space-2);
        flex-wrap: wrap;
      }

      @media (max-width: 720px) {
        .modal {
          padding: 0;
          align-items: flex-end;
        }

        .modal-card {
          width: 100%;
          max-height: 92dvh;
          border-radius: 20px 20px 0 0;
          border-bottom: none;
          border-left: none;
          border-right: none;
        }

        .modal-header {
          padding: 12px 16px;
        }

        .modal-body {
          padding: 16px;
          gap: 14px;
        }

        .form-grid {
          grid-template-columns: 1fr;
          gap: 12px;
        }

        .field select,
        .field input[type="text"],
        .field input[type="number"],
        .field input[type="password"],
        .field textarea {
          font-size: 16px; /* Prevents auto-zoom on iOS */
          padding: 10px 12px;
          min-height: 44px;
        }

        .modal-actions {
          padding: 12px 16px calc(12px + env(safe-area-inset-bottom)) 16px;
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 10px;
        }

        .modal-actions button {
          width: 100%;
          min-height: 44px;
          font-size: 15px;
        }
      }



      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 1ms !important;
          animation-duration: 1ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>

      function getUiLanguage() {
        return localStorage.getItem('srlt_ui_lang') || 'es';
      }

      function setUiLanguage(lang) {
        const currentLang = (lang === 'en' || lang === 'es') ? lang : 'es';
        try { localStorage.setItem('srlt_ui_lang', currentLang); } catch(e){}
        document.documentElement.setAttribute('lang', currentLang);
        document.documentElement.setAttribute('data-ui-lang', currentLang);

        const labels = document.querySelectorAll('.lang-toggle-btn, #baseLangToggle, #indexLangToggle');
        labels.forEach(btn => {
          const lbl = btn.querySelector('#baseLangLabel') || btn.querySelector('#indexLangLabel') || btn;
          lbl.textContent = currentLang === 'es' ? '🌐 ES' : '🌐 EN';
          btn.setAttribute('title', currentLang === 'es' ? 'Cambiar idioma (Español / English)' : 'Switch language (Spanish / English)');
        });

        document.querySelectorAll('[data-i18n]').forEach(el => {
          const key = el.getAttribute('data-i18n');
          if (I18N[currentLang] && I18N[currentLang][key]) {
            el.textContent = I18N[currentLang][key];
          }
        });

        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
          const key = el.getAttribute('data-i18n-placeholder');
          if (I18N[currentLang] && I18N[currentLang][key]) {
            el.setAttribute('placeholder', I18N[currentLang][key]);
          }
        });

        document.querySelectorAll('[data-i18n-title]').forEach(el => {
          const key = el.getAttribute('data-i18n-title');
          if (I18N[currentLang] && I18N[currentLang][key]) {
            el.setAttribute('title', I18N[currentLang][key]);
            el.setAttribute('aria-label', I18N[currentLang][key]);
          }
        });

        window.dispatchEvent(new CustomEvent('srlt-lang-change', { detail: { lang: currentLang } }));
      }

      function toggleUiLanguage() {
        const current = getUiLanguage();
        const next = current === 'es' ? 'en' : 'es';
        setUiLanguage(next);
      }

      function t(key, fallback = '') {
        const lang = getUiLanguage();
        return (I18N[lang] && I18N[lang][key]) || fallback || key;
      }

      function toggleTheme() {
        const root = document.documentElement;
        const current = root.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        const next = current === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('srlt_theme', next); } catch(e){}
        window.dispatchEvent(new CustomEvent('srlt-theme-change', { detail: { theme: next } }));
      }

      // Initial i18n run on load
      document.addEventListener('DOMContentLoaded', () => {
        setUiLanguage(getUiLanguage());
      });
      // Run immediately if DOM ready
      if (document.readyState === 'interactive' || document.readyState === 'complete') {
        setUiLanguage(getUiLanguage());
      }
    </script>
