<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{{ session.name }} — Pantalla Gigante Smart TV (Stage {{ session.id | upper }})</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #000000;
      --text-main: #fbb212;
      --text-sub: #fef08a;
      --text-orig: #9ca3af;
      --accent: #fbb212;
      --card-bg: rgba(18, 18, 18, 0.75);
      --font-size: 3.6rem;
      --line-height: 1.35;
      --text-align: center;
      --justify-content: center; /* Center by default for Smart TV */
      --shadow-sub: 0 4px 18px rgba(0, 0, 0, 0.95), 0 2px 6px rgba(0,0,0,0.8);
    }

    /* Color Palettes */
    body.theme-yellow {
      --bg-color: #000000;
      --text-main: #fbb212;
      --text-sub: #fef08a;
      --text-orig: #9ca3af;
      --accent: #fbb212;
      --card-bg: rgba(13, 13, 13, 0.88);
    }
    body.theme-white {
      --bg-color: #000000;
      --text-main: #ffffff;
      --text-sub: #e2e8f0;
      --text-orig: #94a3b8;
      --accent: #fbb212;
      --card-bg: rgba(13, 13, 13, 0.88);
    }
    body.theme-cyan {
      --bg-color: #000000;
      --text-main: #219f9d;
      --text-sub: #5eead4;
      --text-orig: #64748b;
      --accent: #219f9d;
      --card-bg: rgba(13, 13, 13, 0.88);
    }
    body.theme-red {
      --bg-color: #000000;
      --text-main: #e63e4a;
      --text-sub: #fca5a5;
      --text-orig: #9ca3af;
      --accent: #e63e4a;
      --card-bg: rgba(13, 13, 13, 0.88);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Top Stage Bar */
    .stage-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 1.25rem 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 50;
      background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
      pointer-events: none;
    }
    .stage-badge {
      font-size: 1.1rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: var(--accent);
      color: #000;
      padding: 6px 18px;
      border-radius: 999px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    }
    .stage-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.9);
      margin-left: 14px;
    }
    .live-indicator {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 1.1rem;
      font-weight: 800;
      color: #e63e4a;
      background: rgba(0,0,0,0.6);
      padding: 6px 18px;
      border-radius: 999px;
      border: 1px solid rgba(230, 62, 74, 0.4);
      backdrop-filter: blur(8px);
    }
    .live-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #e63e4a;
      animation: pulseDot 1.2s infinite ease-in-out;
    }
    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 1; box-shadow: 0 0 10px #e63e4a; }
      50% { transform: scale(1.3); opacity: 0.6; box-shadow: 0 0 20px #e63e4a; }
    }

    /* Subtitles Container */
    .tv-screen-container {
      flex: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: var(--justify-content);
      align-items: center;
      padding: 5rem 4vw 4.5rem;
      position: relative;
      z-index: 10;
    }

    .subtitles-stage-box {
      width: 100%;
      max-width: 1600px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      text-align: var(--text-align);
      transition: all 0.25s ease;
    }

    /* Primary Active Subtitle (Huge) */
    .active-caption {
      font-size: var(--font-size);
      line-height: var(--line-height);
      font-weight: 800;
      color: var(--text-main);
      text-shadow: var(--shadow-sub);
      animation: captionPop 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      word-break: break-word;
      transition: font-size 0.2s ease, text-align 0.2s ease;
    }
    .active-caption.interim-live {
      opacity: 0.92;
      filter: brightness(1.1);
    }
    .active-caption-sublang {
      font-size: calc(var(--font-size) * 0.72);
      line-height: var(--line-height);
      font-weight: 700;
      color: var(--text-sub);
      text-shadow: var(--shadow-sub);
      margin-top: 0.5rem;
      opacity: 0.95;
    }

    /* Previous Subtitle (Smooth Dimmed History) */
    .prev-caption {
      font-size: calc(var(--font-size) * 0.52);
      line-height: 1.35;
      font-weight: 600;
      color: var(--text-orig);
      opacity: 0.55;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      transition: opacity 0.3s ease;
    }

    @keyframes captionPop {
      0% { transform: translateY(12px) scale(0.98); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    /* Corner Floating QR Code for Audience */
    .floating-qr-card {
      position: fixed;
      bottom: 24px;
      right: 28px;
      z-index: 60;
      background: rgba(12, 12, 12, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .floating-qr-card.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(20px);
    }
    .floating-qr-img {
      width: 74px;
      height: 74px;
      border-radius: 8px;
      background: #fff;
      padding: 3px;
    }
    .floating-qr-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .floating-qr-title {
      font-size: 0.85rem;
      font-weight: 800;
      color: #fff;
    }
    .floating-qr-sub {
      font-size: 0.72rem;
      color: #94a3b8;
    }

    /* Floating HUD Control Bar (Auto-hides on idle) */
    .hud-controls-bar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      background: rgba(15, 15, 15, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(16px);
      border-radius: 999px;
      padding: 8px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.8);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    body.user-active .hud-controls-bar {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    .hud-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .hud-btn:hover, .hud-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }
    .hud-divider {
      width: 1px;
      height: 20px;
      background: rgba(255, 255, 255, 0.18);
    }
    /* Fullscreen Mode: completely hide the HUD options menu bar until Escape */
    :fullscreen .hud-controls-bar,
    :-webkit-full-screen .hud-controls-bar,
    :-moz-full-screen .hud-controls-bar,
    :-ms-fullscreen .hud-controls-bar,
    body.is-fullscreen .hud-controls-bar,
    html.is-fullscreen .hud-controls-bar,
    body.is-fullscreen #hudBar,
    html.is-fullscreen #hudBar,
    body.is-fullscreen.user-active .hud-controls-bar,
    html.is-fullscreen body.user-active .hud-controls-bar {
      display: none !important;
      opacity: 0 !important;
      pointer-events: none !important;
      visibility: hidden !important;
      transform: translateX(-50%) translateY(120px) !important;
    }

    /* Mobile & Touch Fullscreen Exit Button */
    .tv-fullscreen-exit {
      display: none;
      position: fixed;
      top: calc(env(safe-area-inset-top, 16px) + 12px);
      right: calc(env(safe-area-inset-right, 16px) + 12px);
      z-index: 100000;
      background: rgba(20, 20, 20, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.2s ease;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.6);
    }
    body.is-fullscreen.show-exit-btn .tv-fullscreen-exit,
    :fullscreen.show-exit-btn .tv-fullscreen-exit {
      display: inline-flex;
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>
<body class="theme-yellow user-active">

  <!-- Mobile Floating Exit Button for Fullscreen -->
  <button id="floatingTvExitBtn" class="tv-fullscreen-exit" onclick="toggleFullscreen()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    ✕ Salir de Pantalla Completa
  </button>

  <!-- Stage Top Bar -->
  <header class="stage-header">
    <div style="display: flex; align-items: center; gap: 14px;">
      <img src="https://nerdearla.com/static/images/NERDEARLA_black_nav.webp" alt="Nerdearla" style="height: 28px; width: auto;" onerror="this.onerror=null; this.src='/static/images/nerdearla_logo.webp';" />
      <span class="stage-badge">{{ session.id | upper }}</span>
      <span class="stage-title" id="tvStageTitle">{{ session.name }}</span>
      <span style="font-size: 1rem; color: #94a3b8; margin-left: 12px;">🎤 {{ session.speaker }}</span>
    </div>
    <div class="live-indicator">
      <div class="live-dot"></div>
      <span>EN VIVO</span>
    </div>
  </header>

  <!-- Main Smart TV Presentation Area -->
  <main class="tv-screen-container" id="tvScreenContainer">
    <div class="subtitles-stage-box" id="subtitlesBox">
      <!-- Historical Previous Line -->
      <div class="prev-caption" id="prevCaption">
        Esperando transmisión en vivo del orador...
      </div>

      <!-- Active Primary Line (Massive Font) -->
      <div class="active-caption" id="activeCaption">
        Subtítulos en tiempo real para Smart TV
      </div>

      <!-- Secondary Language Line (if multi-language active) -->
      <div class="active-caption-sublang" id="activeSubCaption" style="display: none;"></div>
    </div>
  </main>

  <!-- Floating Audience QR Card (Corner) -->
  <aside class="floating-qr-card" id="floatingQrCard">
    <img id="tvQrImage" class="floating-qr-img" src="" alt="QR Acceso Móvil" />
    <div class="floating-qr-info">
      <div class="floating-qr-title">📱 Escanea con tu Móvil</div>
      <div class="floating-qr-sub">Sigue los subtítulos en tu asiento</div>
    </div>
  </aside>

  <!-- HUD Control Bar (Disappears after 3s of inactivity) -->
  <nav class="hud-controls-bar" id="hudBar">
    <span class="hud-label">📺 Smart TV:</span>

    <!-- Font Size Options -->
    <div style="display: flex; gap: 4px; align-items: center;">
      <button class="hud-btn" onclick="stepFontSize(-0.4)" title="Reducir Letra (Tecla -)">A-</button>
      <button class="hud-btn" id="btnFont32" onclick="setFontPreset('3.2rem', this)">50" (Grande)</button>
      <button class="hud-btn active" id="btnFont42" onclick="setFontPreset('4.2rem', this)">60" (Gigante)</button>
      <button class="hud-btn" id="btnFont52" onclick="setFontPreset('5.5rem', this)">75"+ (Mega)</button>
      <button class="hud-btn" onclick="stepFontSize(0.4)" title="Aumentar Letra (Tecla +)">A+</button>
    </div>

    <div class="hud-divider"></div>

    <!-- Position / Alignment -->
    <div style="display: flex; gap: 4px; align-items: center;">
      <span class="hud-label">Alineación:</span>
      <button class="hud-btn active" id="alignCenterBtn" onclick="setTextAlign('center', this)" title="Centrado (Recomendado TV)">Centrado</button>
      <button class="hud-btn" id="alignLeftBtn" onclick="setTextAlign('left', this)">Izquierda</button>
    </div>

    <div class="hud-divider"></div>

    <div style="display: flex; gap: 4px; align-items: center;">
      <span class="hud-label">Posición:</span>
      <button class="hud-btn active" id="posCenterBtn" onclick="setVerticalPos('center', this)">Centro</button>
      <button class="hud-btn" id="posBottomBtn" onclick="setVerticalPos('flex-end', this)">Abajo (TV)</button>
    </div>

    <div class="hud-divider"></div>

    <!-- Color Theme -->
    <div style="display: flex; gap: 4px; align-items: center;">
      <span class="hud-label">Color:</span>
      <button class="hud-btn" onclick="setTheme('theme-yellow')">🟡 Oro (#fbb212)</button>
      <button class="hud-btn" onclick="setTheme('theme-cyan')">🔷 Cian (#219f9d)</button>
      <button class="hud-btn" onclick="setTheme('theme-red')">🔴 Coral (#e63e4a)</button>
      <button class="hud-btn" onclick="setTheme('theme-white')">⚪ Blanco</button>
    </div>

    <div class="hud-divider"></div>

    <!-- QR Toggle & Fullscreen -->
    <button class="hud-btn" id="toggleQrBtn" onclick="toggleQrCard()">📱 QR</button>
    <button class="hud-btn" onclick="toggleFullscreen()" style="background: var(--accent); color: #000;">⛶ Pantalla Completa</button>
    <a href="/session/{{ session.id }}" class="hud-btn" style="text-decoration: none;">Vista Normal ↗</a>
  </nav>

  <script>
    const SESSION_ID = {{ session.id | tojson }};
    let targetLanguages = {{ session.target_languages | tojson }};
    let sourceLanguage = {{ session.source_language | tojson }};

    const activeCaption = document.getElementById('activeCaption');
    const activeSubCaption = document.getElementById('activeSubCaption');
    const prevCaption = document.getElementById('prevCaption');
    const tvScreenContainer = document.getElementById('tvScreenContainer');
    const floatingQrCard = document.getElementById('floatingQrCard');
    const tvQrImage = document.getElementById('tvQrImage');

    // LocalStorage Persistent Settings for Smart TV (Default position: Center in all stages)
    let currentFontSizeRem = parseFloat(localStorage.getItem('srlt_tv_font') || '4.2');
    let currentAlign = localStorage.getItem('srlt_tv_align') || 'center';
    let currentPos = localStorage.getItem('srlt_tv_pos') || 'center';
    let currentTheme = localStorage.getItem('srlt_tv_theme') || 'theme-yellow';
    let isQrHidden = localStorage.getItem('srlt_tv_qr') === 'hidden';

    // Apply stored preferences on load
    function initTvPreferences() {
      document.documentElement.style.setProperty('--font-size', `${currentFontSizeRem}rem`);
      document.documentElement.style.setProperty('--text-align', currentAlign);
      document.documentElement.style.setProperty('--justify-content', currentPos);
      document.body.className = `${currentTheme} user-active`;

      // Active font button
      document.querySelectorAll('#btnFont32, #btnFont42, #btnFont52').forEach(b => b.classList.remove('active'));
      if (currentFontSizeRem <= 3.4) document.getElementById('btnFont32').classList.add('active');
      else if (currentFontSizeRem <= 4.6) document.getElementById('btnFont42').classList.add('active');
      else document.getElementById('btnFont52').classList.add('active');

      // Active align/position buttons
      document.getElementById('alignCenterBtn').classList.toggle('active', currentAlign === 'center');
      document.getElementById('alignLeftBtn').classList.toggle('active', currentAlign === 'left');
      document.getElementById('posBottomBtn').classList.toggle('active', currentPos === 'flex-end');
      document.getElementById('posCenterBtn').classList.toggle('active', currentPos === 'center');

      // QR visibility
      if (isQrHidden) {
        floatingQrCard.classList.add('hidden');
        document.getElementById('toggleQrBtn').classList.remove('active');
      } else {
        document.getElementById('toggleQrBtn').classList.add('active');
      }
    }
    initTvPreferences();

    // Setup Audience QR
    const audienceUrl = `${window.location.origin}/session/${SESSION_ID}`;
    tvQrImage.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(audienceUrl)}`;

    // Controls Auto-Hide
    let userTimeout = null;
    let isCssFullscreen = false;

    function isCurrentlyFullscreen() {
      const native = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
      return native || isCssFullscreen;
    }

    function resetActivity() {
      // While in fullscreen, never show the options menu!
      if (isCurrentlyFullscreen()) {
        document.body.classList.remove('user-active');
        return;
      }
      document.body.classList.add('user-active');
      clearTimeout(userTimeout);
      userTimeout = setTimeout(() => {
        document.body.classList.remove('user-active');
      }, 4000);
    }
    window.addEventListener('mousemove', resetActivity);
    window.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape' && e.key !== 'Esc') resetActivity();
    });
    window.addEventListener('touchstart', resetActivity);
    resetActivity();

    // Font Controls
    function setFontPreset(size, btn) {
      document.documentElement.style.setProperty('--font-size', size);
      currentFontSizeRem = parseFloat(size);
      localStorage.setItem('srlt_tv_font', currentFontSizeRem.toString());
      document.querySelectorAll('#btnFont32, #btnFont42, #btnFont52').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
    }

    function stepFontSize(delta) {
      currentFontSizeRem = Math.max(1.8, Math.min(7.0, currentFontSizeRem + delta));
      document.documentElement.style.setProperty('--font-size', `${currentFontSizeRem.toFixed(1)}rem`);
      localStorage.setItem('srlt_tv_font', currentFontSizeRem.toFixed(1));
    }

    // Text Alignment & Vertical Position
    function setTextAlign(align, btn) {
      currentAlign = align;
      document.documentElement.style.setProperty('--text-align', align);
      localStorage.setItem('srlt_tv_align', align);
      document.getElementById('alignCenterBtn').classList.toggle('active', align === 'center');
      document.getElementById('alignLeftBtn').classList.toggle('active', align === 'left');
    }

    function setVerticalPos(pos, btn) {
      currentPos = pos;
      document.documentElement.style.setProperty('--justify-content', pos);
      localStorage.setItem('srlt_tv_pos', pos);
      document.getElementById('posBottomBtn').classList.toggle('active', pos === 'flex-end');
      document.getElementById('posCenterBtn').classList.toggle('active', pos === 'center');
    }

    // Themes
    function setTheme(theme) {
      currentTheme = theme;
      document.body.className = `${theme} user-active`;
      localStorage.setItem('srlt_tv_theme', theme);
    }

    // QR Card Toggle
    function toggleQrCard() {
      floatingQrCard.classList.toggle('hidden');
      const isNowHidden = floatingQrCard.classList.contains('hidden');
      localStorage.setItem('srlt_tv_qr', isNowHidden ? 'hidden' : 'visible');
      document.getElementById('toggleQrBtn').classList.toggle('active', !isNowHidden);
    }

    // Fullscreen Listeners and Handlers
    function updateFullscreenState() {
      const native = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
      if (native) {
        document.body.classList.add('is-fullscreen');
        document.documentElement.classList.add('is-fullscreen');
        document.body.classList.remove('user-active');
      } else {
        isCssFullscreen = false;
        document.body.classList.remove('is-fullscreen');
        document.documentElement.classList.remove('is-fullscreen');
        document.body.classList.add('user-active');
        resetActivity();
      }
    }
    document.addEventListener('fullscreenchange', updateFullscreenState);
    document.addEventListener('webkitfullscreenchange', updateFullscreenState);
    document.addEventListener('mozfullscreenchange', updateFullscreenState);
    document.addEventListener('MSFullscreenChange', updateFullscreenState);

    function toggleFullscreen() {
      const isFull = isCurrentlyFullscreen();
      if (!isFull) {
        isCssFullscreen = true;
        document.body.classList.add('is-fullscreen');
        document.documentElement.classList.add('is-fullscreen');
        document.body.classList.remove('user-active');
        const docEl = document.documentElement;
        const rfs = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
        if (rfs) {
          rfs.call(docEl).catch(() => {});
        }
      } else {
        isCssFullscreen = false;
        document.body.classList.remove('is-fullscreen');
        document.documentElement.classList.remove('is-fullscreen');
        const efs = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
        if (efs && (document.fullscreenElement || document.webkitFullscreenElement)) {
          efs.call(document).catch(() => {});
        }
        document.body.classList.add('user-active');
        resetActivity();
      }
    }

    // Double click to toggle fullscreen
    document.addEventListener('dblclick', (e) => {
      if (e.target.closest('.hud-controls-bar, button, a, .floating-qr-card')) return;
      toggleFullscreen();
    });

    // Show floating exit button briefly on touch / click on mobile in fullscreen
    let tvExitTimeout = null;
    function showTvExitButton() {
      if (isCurrentlyFullscreen()) {
        document.body.classList.add('show-exit-btn');
        clearTimeout(tvExitTimeout);
        tvExitTimeout = setTimeout(() => {
          document.body.classList.remove('show-exit-btn');
        }, 3500);
      }
    }
    window.addEventListener('touchstart', showTvExitButton, { passive: true });
    window.addEventListener('click', showTvExitButton);

    // Keyboard Shortcuts for TV remote / presentation clicks
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' || e.key === 'Esc') {
        isCssFullscreen = false;
        document.body.classList.remove('is-fullscreen');
        document.documentElement.classList.remove('is-fullscreen');
        const efs = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
        if (efs && (document.fullscreenElement || document.webkitFullscreenElement)) {
          efs.call(document).catch(() => {});
        }
        document.body.classList.add('user-active');
        resetActivity();
        return;
      }
      if (e.key === 'f' || e.key === 'F') {
        toggleFullscreen();
        return;
      }
      if (e.key === '+' || e.key === '=') stepFontSize(0.4);
      if (e.key === '-' || e.key === '_') stepFontSize(-0.4);
      if (e.key === 'c' || e.key === 'C') {
        setTextAlign(currentAlign === 'center' ? 'left' : 'center');
      }
      if (e.key === 'p' || e.key === 'P') {
        setVerticalPos(currentPos === 'center' ? 'flex-end' : 'center');
      }
      if (e.key === 'q' || e.key === 'Q') toggleQrCard();
    });

    // WebSocket Stream Connection
    let lastCommittedText = '';

    const NERDEARLA_REGEX = /\b(?:nerd(?:[-_.\s]*(?:e?ar\s*la|earl[ay]?|ear|er\s*la|eala|e\s*a\s*la|e\s*arla|a\s*la|dar\s*la|diar\s*la|dia\s*la|iar\s*la|ia\s*la|ierla|eada|eado|arlo|alas|alos|ela|ala|alla|alta|era|la)|[\.]la)|nerd\s+(?:de\s+)?(?:habla|aula|charla|arla|alma|armas)|nerd\s+y\s+(?:habla|arla)|nerdy\s*(?:arla|earla)|merd(?:[-_.\s]*(?:e?ar\s*la|er\s*la|eada|ear))|verd(?:[-_.\s]*(?:ear\s*la|e\s+habla)))\b/gi;
    function normalizeNerdearla(text) {
      if (!text) return text;
      return String(text).replace(NERDEARLA_REGEX, 'Nerdearla');
    }

    function getCaptionText(eventData) {
      const userLang = (typeof getUiLanguage === 'function' ? getUiLanguage() : localStorage.getItem('srlt_ui_lang')) || 'es';
      let activeLangs = (targetLanguages && targetLanguages.length > 0) ? [...targetLanguages] : ['es'];
      if (activeLangs.includes(userLang)) {
        activeLangs = [userLang, ...activeLangs.filter(l => l !== userLang)];
      }
      const primaryLang = activeLangs[0] || 'es';
      const text = (eventData.translations && eventData.translations[primaryLang]) 
             || (primaryLang === eventData.source_language ? eventData.original : null)
             || (eventData.translations && eventData.translations.es)
             || eventData.original || '';
      return normalizeNerdearla(text);
    }

    function connectWebSocket() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}/ws/session/${SESSION_ID}/viewer`;
      const ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        console.log('Smart TV Stage Display connected');
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === 'handshake' && data.session) {
            if (data.session.target_languages) targetLanguages = data.session.target_languages;
            if (data.session.source_language) sourceLanguage = data.session.source_language;
            if (data.session.name) document.getElementById('tvStageTitle').textContent = data.session.name;

            // Restore recent transcript history on reload!
            if (data.history && Array.isArray(data.history) && data.history.length > 0) {
              const last = data.history[data.history.length - 1];
              const prev = data.history.length > 1 ? data.history[data.history.length - 2] : null;
              if (prev) {
                prevCaption.textContent = getCaptionText(prev);
              }
              if (last) {
                lastCommittedText = getCaptionText(last);
                activeCaption.className = 'active-caption';
                activeCaption.textContent = lastCommittedText;
              }
            }
          } else if (data.type === 'clear_history') {
            lastCommittedText = '';
            prevCaption.textContent = '';
            activeCaption.textContent = '';
            activeSubCaption.style.display = 'none';
          } else if (data.type === 'interim' || data.type === 'final') {
            handleLiveSubtitle(data);
          }
        } catch (err) {
          console.error(err);
        }
      };

      ws.onclose = () => {
        setTimeout(connectWebSocket, 3000);
      };

      ws.onerror = () => {
        ws.close();
      };
    }

    function handleLiveSubtitle(data) {
      const userLang = (typeof getUiLanguage === 'function' ? getUiLanguage() : localStorage.getItem('srlt_ui_lang')) || 'es';
      let activeLangs = (targetLanguages && targetLanguages.length > 0) ? [...targetLanguages] : ['es'];
      if (activeLangs.includes(userLang)) {
        activeLangs = [userLang, ...activeLangs.filter(l => l !== userLang)];
      }
      const primaryLang = activeLangs[0] || 'es';
      const secondaryLang = (activeLangs.length > 1) ? activeLangs[1] : null;

      const mainText = getCaptionText(data);
      if (!mainText) return;

      if (data.type === 'interim') {
        activeCaption.className = 'active-caption interim-live';
        activeCaption.textContent = mainText;

        if (secondaryLang && data.translations && data.translations[secondaryLang]) {
          activeSubCaption.style.display = 'block';
          activeSubCaption.textContent = `${secondaryLang.toUpperCase()}: ${data.translations[secondaryLang]}`;
        } else {
          activeSubCaption.style.display = 'none';
        }
      } else if (data.type === 'final') {
        if (lastCommittedText) {
          prevCaption.textContent = lastCommittedText;
        }
        lastCommittedText = mainText;

        activeCaption.className = 'active-caption';
        activeCaption.textContent = mainText;

        if (secondaryLang && data.translations && data.translations[secondaryLang]) {
          activeSubCaption.style.display = 'block';
          activeSubCaption.textContent = `${secondaryLang.toUpperCase()}: ${data.translations[secondaryLang]}`;
        } else {
          activeSubCaption.style.display = 'none';
        }
      }
    }

    connectWebSocket();
  </script>
</body>
</html>
